name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:boundary
      - run: pnpm lint
      - run: pnpm test
      - name: Create build-only environment
        shell: bash
        run: |
          cat > .env.local <<'EOF'
          DATABASE_URL=postgresql://build:build@127.0.0.1:55432/build
          SESSION_SECRET=ci-build-session-secret-not-for-runtime
          WIKI_REPO_ROOT=/tmp/jarvis-wiki-build
          MINIO_ENDPOINT=http://127.0.0.1:59000
          MINIO_ACCESS_KEY=ci-build
          MINIO_SECRET_KEY=ci-build-secret
          MINIO_BUCKET=ci-build
          LLM_GATEWAY_URL=http://127.0.0.1:8317/v1
          LLM_GATEWAY_KEY=ci-build-local-proxy-secret
          ASK_AI_MODEL=gpt-5.6-terra
          INGEST_AI_MODEL=gpt-5.6-sol
          ASK_DAILY_BUDGET_USD=1
          EOF
      - run: pnpm build
      - run: pnpm security:scan:content
